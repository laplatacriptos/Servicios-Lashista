<main>
    <h1>Solicitar turno:</h1>
    <form action="https://formsubmit.co/f9724f5c099229133e4ca9b2bc040531" method="POST">

        <section id="confirm-form">

            <h2>Por favor, confirma tus datos</h2>
            <p>Dia del turno: </p> <input type="text" name="dia" id="confirm-dia" required readonly />
            <p>Horario: </p> <input type="text" name="horario" id="confirm-horario" required readonly />
            <p>Domicilio: </p> <input type="text" name="domicilio" id="confirm-domicilio" required readonly />
            <p>Nombre: </p> <input type="text" name="nombre" id="confirm-nombre" required readonly />
            <p>Correo Electrónico: </p> <input type="text" name="email" id="confirm-correo" required readonly />
            <p>Estilo: </p> <input type="text" name="efecto" id="confirm-estilo" required readonly />
            <p>Telefono de contacto: </p> <input type="text" name="whatsapp" id="confirm-wsp" required readonly />
            <!-- Agrega más campos aquí -->
        </section>
        <section id="form">
            <label for="dia">Dia: <em>*</em></label>
            <input type="date" id="dia" required>
            <select id="horario">
                <option value="mañana">Por la mañana</option>
                <option value="tarde">Por la tarde</option>
            </select>
            <label for="domicilio">Domicilio: <em>*</em></label>
            <input type="text" id="domicilio" required></label>
            <label for="nombre">Nombre: <em>*</em></label>
            <input type="text" id="nombre" required>
            <label for="correo">Correo electrónico: <em>*</em></label>
            <input type="email" id="correo" required>
            <label for="wsp">whatsapp: <em>*</em></label>
            <input type="text" id="wsp" required>
            <select id="estilo">
                <option value="efectoRimel" id="efectoRimel">efecto Rimel</option>
                <option value="efecto2D" id="efecto2D">efecto 2D</option>
                <option value="efecto3D" id="efecto3D">efecto 3D</option>
                <option value="efectoRusso" id="efectoRusso">Russo</option>
                <option value="efectoLifting" id="efectoLifting">Lifting</option>
                <option value="efectoMegaVolumen" id="efectoMegaVolumen">Megavolumen</option>
                <option value="noLoSeAun" id="noLoSeAun">No lo sé aún!</option>
            </select>
        </section>

        <div class="terms-checkbox">
            <label for="terms"></label><input type="checkbox" id="terms" name="terms" style="max-width: 20px;" required>
            Acepto los <a href="./terminos-y-condiciones.html">Términos y Condiciones</a></label>
        </div>

        <p class="error">Completar todos los campos <em>*</em></p>

        <section class="btn">
            <button type="reset" id="btnModificar" onclick="modificar()">Modificar</button>
            <div>
                <button type="button" id="btnMostrarConfirmacion" onclick="mostrarConfirmacion()">Solicitar</button>
                <button type="submit" name="btnSolicitarTurno" id="btnSolicitarTurno" onclick="confirmar()">Confirmar</button>
            </div>
        </section>
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://laplatacriptos.github.io/Servicios-Lashista/turnos.html">
        <div class="check" id="checkDiv">
            Todo Listo En breve te contacta tu lashista
            <span class="material-symbols-outlined">
                check_circle
            </span>
        </div>
        
    </form>
